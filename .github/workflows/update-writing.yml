name: Update writing

# Baja los feeds (Substack, Medium, Blogger) y regenera writing/index.html.
# Los workflows con schedule solo corren desde la rama por defecto (main).
on:
  schedule:
    - cron: "0 12 * * 1" # lunes 12:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Regenerate writing page
        run: python3 scripts/update_writing.py

      - name: Commit and push if something changed
        id: commit
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Sin cambios."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add writing/
          git commit -m "Actualizar writing desde los feeds"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # Un push hecho con GITHUB_TOKEN puede no disparar el build de Pages: se pide a mano.
      - name: Request a Pages build
        if: steps.commit.outputs.changed == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds"
